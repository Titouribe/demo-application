<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Adicionar Empleado</title>

    <!-- Bootswatch (Bootstrap 5) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/morph/bootstrap.min.css"/>

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css"/>
</head>

<body>
<div class="container mt-4" style="max-width: 600px;">

    <h1 class="mb-4">
        <i class="fas fa-user-plus"></i> Adicionar Empleado
    </h1>

    <!-- Mensaje de error -->
    <div class="alert alert-danger alert-dismissible fade show"
         th:if="${errorMessage}" role="alert">
        <i class="fas fa-exclamation-triangle"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Formulario -->
    <form th:action="${employee.id != null} ? @{/view/employee/edit} : @{/view/employee/new}"
          th:object="${employee}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <!-- Nombres -->
        <div class="mb-3">
            <label for="firstName" class="form-label">
                <i class="fas fa-user"></i> Nombres <span class="text-danger">*</span>
            </label>
            <input type="text"
                   th:field="*{firstName}"
                   id="firstName"
                   class="form-control"
                   placeholder="Ej: Juan"
                   required/>
        </div>

        <!-- Apellidos -->
        <div class="mb-3">
            <label for="lastName" class="form-label">
                <i class="fas fa-user"></i> Apellidos <span class="text-danger">*</span>
            </label>
            <input type="text"
                   th:field="*{lastName}"
                   id="lastName"
                   class="form-control"
                   placeholder="Ej: Pérez"
                   required/>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="email" class="form-label">
                <i class="fas fa-envelope"></i> Email <span class="text-danger">*</span>
            </label>
            <input type="email"
                   th:field="*{email}"
                   id="email"
                   class="form-control"
                   placeholder="Ej: juan@empresa.com"
                   required/>
        </div>

        <!-- Salario -->
        <div class="mb-3">
            <label for="salaryPerHour" class="form-label">
                <i class="fas fa-dollar-sign"></i> Salario por hora
                <span class="text-danger">*</span>
            </label>
            <input type="number"
                   th:field="*{salaryPerHour}"
                   id="salaryPerHour"
                   class="form-control"
                   step="0.01"
                   min="0.10"
                   placeholder="Ej: 25.50"
                   required/>
        </div>

        <!-- Botones -->
        <div class="mt-4 d-flex justify-content-between">
            <button type="submit" class="btn btn-outline-primary">
                <i class="fas fa-save"></i> Guardar
            </button>

            <a th:href="@{/view/employee}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
