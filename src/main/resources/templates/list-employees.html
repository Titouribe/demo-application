<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Gestión de Empleados</title>

    <!-- Bootswatch (Bootstrap 5) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/morph/bootstrap.min.css"/>

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css"/>
</head>

<body>
<div class="container mt-4">

    <h1 class="mb-3">
        <i class="fas fa-users"></i> Lista de Empleados
        <span class="badge bg-light ms-3"
              th:text="${totalCount} + ' ' + (${totalCount} == 1 ? 'empleado' : 'empleados')">
            0 empleados
        </span>
    </h1>

    <!-- Mensaje éxito -->
    <div class="alert alert-success alert-dismissible fade show"
         th:if="${successMessage}" role="alert">
        <i class="fas fa-check-circle"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Mensaje error -->
    <div class="alert alert-danger alert-dismissible fade show"
         th:if="${errorMessage}" role="alert">
        <i class="fas fa-exclamation-triangle"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Botón añadir -->
    <div class="mb-3 text-end">
        <a th:href="@{/view/employee/new}" class="btn btn-outline-light">
            <i class="fas fa-user-plus"></i> Añadir Empleado
        </a>
    </div>

    <!-- Tabla -->
    <table class="table table-striped table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>Email</th>
            <th>Salario/Hora</th>
            <th>Fecha creación</th>
            <th class="text-center">Editar</th>
            <th class="text-center">Eliminar</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="emp, stat : ${employees}">
            <td th:text="${stat.count}">1</td>
            <td th:text="${emp.firstName}">Nombre</td>
            <td th:text="${emp.lastName}">Apellido</td>

            <td>
                <span th:if="${emp.email != null and !emp.email.isEmpty()}"
                      th:text="${emp.email}">email@correo.com</span>

                <span th:unless="${emp.email != null and !emp.email.isEmpty()}"
                      class="badge bg-secondary">Sin email</span>
            </td>

            <td th:text="'$' + ${#numbers.formatDecimal(emp.salaryPerHour, 1, 2)}">
                $0.00
            </td>

            <td th:text="${#temporals.format(emp.createdDate, 'dd/MM/yyyy HH:mm')}">
                01/01/2024
            </td>

            <!-- Editar -->
            <td class="text-center">
                <a th:href="@{/view/employee/edit/{id}(id=${emp.id})}"
                   class="btn btn-outline-info btn-sm">
                    <i class="fas fa-user-edit"></i>
                </a>
            </td>

            <!-- Eliminar -->
            <td class="text-center">
                <button type="button"
                        class="btn btn-outline-danger btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmDeleteModal"
                        th:attr="data-id=${emp.id}">
                    <i class="fas fa-user-times"></i>
                </button>
            </td>
        </tr>

        <!-- Sin datos -->
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="8" class="text-center text-muted">
                <i class="fas fa-inbox"></i> No hay empleados registrados.
            </td>
        </tr>
        </tbody>
    </table>

</div>

<!-- ===================== MODAL ===================== -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-exclamation-triangle text-warning"></i>
                    Confirmar eliminación
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                ¿Estás seguro de que deseas eliminar este empleado?
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>

                <form id="deleteForm"
                      th:action="@{/view/employee/delete}"
                      method="post">
                    <input type="hidden" name="id" id="deleteEmployeeId"/>
                    <button type="submit" class="btn btn-danger">
                        Sí, eliminar
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const modal = document.getElementById('confirmDeleteModal');

    modal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const employeeId = button.getAttribute('data-id');

        document.getElementById('deleteEmployeeId').value = employeeId;
    });

});
</script>

</body>
</html>
